# Drop this into your target repo as .github/workflows/template-metrics.yml
#
# Required setup in the target repo:
#   1. Set GitHub Actions secrets DEVLAKE_WEBHOOK_URL and DEVLAKE_BASIC_AUTH
#      (or have them inherited from org-level secrets).
#   2. Create .template-provenance.json at repo root (see examples/<lang>/ for templates).
#
# That's it — push to main and the metrics flow.

name: Template Metrics

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  measure:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # required for baseline diff

      - uses: codeandtheory/TemplateCodeMetrics@v1
        with:
          devlake-webhook-url: ${{ secrets.DEVLAKE_WEBHOOK_URL }}
          devlake-basic-auth:  ${{ secrets.DEVLAKE_BASIC_AUTH }}
          # Optional: enable the Claude-judged semantic score alongside the
          # deterministic one. Adds ~1¢ per commit; cosmetic-only diffs
          # (Prettier reformats, renames, comment edits) stop counting as
          # customization. Requires an ANTHROPIC_API_KEY repo/org secret.
          # anthropic-api-key:        ${{ secrets.ANTHROPIC_API_KEY }}
          # semantic-model:           claude-haiku-4-5-20251001
          # semantic-max-diff-lines:  10000
          # Other optional overrides:
          # baseline-commit: <sha>     # falls back to .template-provenance.json or root commit
          # environment: PRODUCTION    # one of PRODUCTION | STAGING | TESTING | DEVELOPMENT
          # fail-on-post-error: true   # set false if you don't want the workflow to fail when DevLake is down
